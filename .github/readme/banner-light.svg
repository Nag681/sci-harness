<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Sci-Harness: plan, test first, lock, fix, verify, commit, then the next task">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient>
<linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="350" y1="0" x2="480" y2="0"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#afb8c1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#0969da" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="1198" height="438" rx="24" fill="url(#bg)" stroke="#d0d7de" stroke-width="2"/>
<text x="600" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#0969da">AN AGENT SKILL FOR LONG CODING TASKS</text>
<text x="600" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-1.5" fill="#1f2328"><tspan fill="url(#mark)">Sci</tspan>-Harness</text>
<text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="21" fill="#57606a">It remembers the plan, runs the tests and refuses shortcuts.</text>
<path d="M1050 271 C1050 212 330 212 330 270" fill="none" stroke="#0969da" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#loop)"/>
<rect x="634" y="214" width="112" height="28" rx="14" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
<text x="690" y="233" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0969da">next task</text>
<path d="M188 304H290" stroke="#afb8c1" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M368 304H470" stroke="#afb8c1" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M548 304H650" stroke="#afb8c1" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M728 304H830" stroke="#afb8c1" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M908 304H1010" stroke="#afb8c1" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="150" cy="304" r="31" fill="#57606a" fill-opacity="0.09" stroke="#57606a" stroke-width="2"/>
<g transform="translate(135 289) scale(1.25)" fill="none" stroke="#57606a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></g>
<text x="150" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Plan</text>
<text x="150" y="393" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">small tasks,</text>
<text x="150" y="413" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">each with a test</text>
<circle cx="330" cy="304" r="31" fill="#cf222e" fill-opacity="0.09" stroke="#cf222e" stroke-width="2"/>
<g transform="translate(315 289) scale(1.25)" fill="none" stroke="#cf222e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.2L4.7 18.4A1.75 1.75 0 0 0 6.2 21h11.6a1.75 1.75 0 0 0 1.5-2.6L14 9.2V3M6.7 15h10.6"/></g>
<text x="330" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Test first</text>
<text x="330" y="393" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">it must fail</text>
<text x="330" y="413" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">before the work</text>
<circle cx="510" cy="304" r="31" fill="#9a6700" fill-opacity="0.09" stroke="#9a6700" stroke-width="2"/>
<g transform="translate(495 289) scale(1.25)" fill="none" stroke="#9a6700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4M12 15v2"/></g>
<text x="510" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Lock</text>
<text x="510" y="393" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">the test can't</text>
<text x="510" y="413" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">be made easier</text>
<circle cx="690" cy="304" r="31" fill="#0969da" fill-opacity="0.09" stroke="#0969da" stroke-width="2"/>
<g transform="translate(675 289) scale(1.25)" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4L8 20H4v-4L17 3zM14 6l4 4"/></g>
<text x="690" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Fix</text>
<text x="690" y="393" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">3 misses in a row</text>
<text x="690" y="413" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">and it says STOP</text>
<circle cx="870" cy="304" r="31" fill="#1a7f37" fill-opacity="0.09" stroke="#1a7f37" stroke-width="2"/>
<g transform="translate(855 289) scale(1.25)" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3zM9 12l2 2 4-4"/></g>
<text x="870" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Verify</text>
<text x="870" y="393" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">what passed before</text>
<text x="870" y="413" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">still passes</text>
<circle cx="1050" cy="304" r="31" fill="#8250df" fill-opacity="0.09" stroke="#8250df" stroke-width="2"/>
<g transform="translate(1035 289) scale(1.25)" fill="none" stroke="#8250df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M3 12h5.8M15.2 12H21"/></g>
<text x="1050" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Commit</text>
<text x="1050" y="393" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">one commit</text>
<text x="1050" y="413" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">per task</text>
</svg>
