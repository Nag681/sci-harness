<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 498" width="924" height="498" role="img" aria-label="Good to know. No coding needed: You describe the job. Your agent does the rest. Stays on your computer: Your code is never sent anywhere. Free and open source: No account, no sign-up. MIT license. Fine for messy projects: Old problems are noted first, so only new ones count. Barely slower: It re-checks only what changed. Works with your agent: Claude Code, Codex, Gemini CLI, Antigravity, OpenCode and pi.">
