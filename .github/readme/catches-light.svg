<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 516" width="924" height="516" role="img" aria-label="How Sci-Harness catches each slip: the plan is written down; the checks are locked; after three misses it stops to find the cause; every step is re-checked before anything is saved.">
<rect x="1" y="1" width="448" height="244" rx="20" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.5"/>
<rect x="28" y="28" width="64" height="64" rx="16" fill="#fdeadb"/>
<g transform="translate(40 40) scale(1.667)" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.8h6V4"/><path d="M8.5 10l1.3 1.3 2.2-2.3M14 10.5h2M8.5 15.5l1.3 1.3 2.2-2.3M14 16h2"/></g>
<g transform="translate(90 32)"><circle r="12" fill="#1a7f37" stroke="#f6f8fa" stroke-width="3"/><path d="M-4 0.5l2.8 2.8L4 -3" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="28" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#17212b" text-anchor="start">The plan is written down.</text>
<text x="28" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#57626e" text-anchor="start">After any break, your agent picks</text>
<text x="28" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#57626e" text-anchor="start">up exactly where it left off.</text>
<rect x="475" y="1" width="448" height="244" rx="20" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.5"/>
<rect x="502" y="28" width="64" height="64" rx="16" fill="#fdeadb"/>
<g transform="translate(514 40) scale(1.667)" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4M12 15v2"/></g>
<g transform="translate(564 32)"><circle r="12" fill="#1a7f37" stroke="#f6f8fa" stroke-width="3"/><path d="M-4 0.5l2.8 2.8L4 -3" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="502" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#17212b" text-anchor="start">The checks are locked.</text>
<text x="502" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#57626e" text-anchor="start">Making a check easier</text>
<text x="502" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#57626e" text-anchor="start">counts as a failure.</text>
<rect x="1" y="271" width="448" height="244" rx="20" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.5"/>
<rect x="28" y="298" width="64" height="64" rx="16" fill="#fdeadb"/>
<g transform="translate(40 310) scale(1.667)" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/><path d="M10.5 7.5V11M10.5 13.6h.01"/></g>
<g transform="translate(90 302)"><circle r="12" fill="#1a7f37" stroke="#f6f8fa" stroke-width="3"/><path d="M-4 0.5l2.8 2.8L4 -3" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="28" y="406" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#17212b" text-anchor="start">Three misses, then it stops.</text>
<text x="28" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#57626e" text-anchor="start">It has to find the cause</text>
<text x="28" y="477" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#57626e" text-anchor="start">before it tries again.</text>
<rect x="475" y="271" width="448" height="244" rx="20" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.5"/>
<rect x="502" y="298" width="64" height="64" rx="16" fill="#fdeadb"/>
<g transform="translate(514 310) scale(1.667)" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></g>
<g transform="translate(564 302)"><circle r="12" fill="#1a7f37" stroke="#f6f8fa" stroke-width="3"/><path d="M-4 0.5l2.8 2.8L4 -3" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="502" y="406" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#17212b" text-anchor="start">Every step is re-checked.</text>
<text x="502" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#57626e" text-anchor="start">Old features are tested again</text>
<text x="502" y="477" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#57626e" text-anchor="start">before anything is saved.</text>
</svg>
